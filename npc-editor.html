<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>One Star Pawn - NPC Commerce Editor</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f2ec;
      --panel: #fffdf8;
      --ink: #1d1b18;
      --muted: #6b6359;
      --line: #d8cec0;
      --accent: #176b87;
      --accent-dark: #104b5f;
      --danger: #9f2f28;
      --ok: #2f6f3e;
      --warn-bg: #fff6dd;
      --warn-line: #d6a93c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.4;
    }

    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 24px auto 40px;
    }

    header,
    .toolbar,
    .editor-panel,
    .list-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    header {
      padding: 18px 20px;
      margin-bottom: 14px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .title-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: baseline;
    }

    .editor-version {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    h2 {
      font-size: 18px;
      margin-bottom: 12px;
    }

    h3 {
      font-size: 15px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }

    button,
    select,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--accent-dark);
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      padding: 8px 12px;
    }

    button.secondary {
      background: #fff;
      color: var(--accent-dark);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .status {
      margin-left: auto;
      color: var(--muted);
      min-height: 20px;
    }

    .status.dirty {
      color: #8a5a00;
    }

    .status.error {
      color: var(--danger);
    }

    .status.saved {
      color: var(--ok);
    }

    .generation-warning {
      border: 1px solid var(--warn-line);
      border-radius: 6px;
      background: var(--warn-bg);
      color: #4f3900;
      padding: 9px 12px;
      margin: 0 0 14px;
      font-size: 13px;
      font-weight: 700;
    }

    .editor-panel {
      padding: 16px;
      margin-bottom: 14px;
    }

    .npc-row {
      display: grid;
      grid-template-columns: minmax(220px, 420px) 1fr;
      gap: 16px;
      align-items: end;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 5px;
    }

    select,
    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 8px 10px;
    }

    textarea {
      min-height: 68px;
      resize: vertical;
    }

    input[type="checkbox"] {
      width: auto;
    }

    .npc-meta {
      padding-bottom: 8px;
    }

    .deal-toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 16px;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      background: #fff;
      font-weight: 700;
    }

    .trait-grid {
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
      padding-top: 16px;
    }

    .trait-grid .wide {
      grid-column: 1 / -1;
    }

    .trait-checks {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .trait-checks label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      padding: 7px 9px;
      font-weight: 700;
    }

    .trait-checks input {
      width: auto;
    }

    .lists {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .list-panel {
      min-height: 360px;
      padding: 14px;
    }

    .list-panel[hidden] {
      display: none;
    }

    .item-list {
      display: grid;
      gap: 6px;
      max-height: 520px;
      overflow: auto;
      padding-right: 4px;
      margin-top: 10px;
    }

    .bulk-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .bulk-actions button {
      border: 0;
      background: transparent;
      color: var(--accent-dark);
      padding: 0;
      font-size: 12px;
      text-decoration: underline;
    }

    .bulk-actions button:disabled {
      color: var(--muted);
      text-decoration: none;
    }

    .item-row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: start;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      padding: 8px;
    }

    .item-row input {
      margin-top: 3px;
    }

    .item-name {
      font-weight: 700;
    }

    .item-id {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .empty {
      color: var(--muted);
      font-style: italic;
      padding: 10px 0;
    }

    @media (max-width: 840px) {
      .npc-row,
      .trait-grid,
      .lists {
        grid-template-columns: 1fr;
      }

      .status {
        flex-basis: 100%;
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="title-row">
        <h1>NPC Commerce Editor</h1>
        <span id="editor-version" class="editor-version">v0.1.57</span>
      </div>
      <p class="muted">Developer-only CSV editor for One Star Pawn NPC buy, sell, and trade tuning.</p>
    </header>

    <p class="generation-warning">CSV edits are source-only. Regenerate gameData.js before testing or shipping gameplay.</p>

    <section class="toolbar" aria-label="File actions">
      <button type="button" id="openFolder">Open Data Folder</button>
      <button type="button" id="save" disabled>Save CSVs</button>
      <button type="button" id="reload" class="secondary" disabled>Reload From Folder</button>
      <span id="status" class="status">Open the CSV data folder to begin.</span>
    </section>

    <section class="editor-panel" aria-label="NPC commerce controls">
      <div class="npc-row">
        <div>
          <label for="npcSelect">NPC</label>
          <select id="npcSelect" disabled></select>
        </div>
        <div class="npc-meta">
          <strong id="npcName">No NPC loaded</strong>
          <div class="muted" id="npcId"></div>
        </div>
      </div>

      <div class="deal-toggles" aria-label="Deal type toggles">
        <label class="toggle">
          <input type="checkbox" id="toggleBuy" disabled />
          Buy
        </label>
        <label class="toggle">
          <input type="checkbox" id="toggleSell" disabled />
          Sell
        </label>
        <label class="toggle">
          <input type="checkbox" id="toggleTrade" disabled />
          Trade
        </label>
      </div>

      <div class="trait-grid" aria-label="Commerce trait fields">
        <div>
          <label for="traitSellWeight">Sell weight</label>
          <input id="traitSellWeight" inputmode="decimal" disabled />
        </div>
        <div>
          <label for="traitBuyWeight">Buy weight</label>
          <input id="traitBuyWeight" inputmode="decimal" disabled />
        </div>
        <div>
          <label for="traitTradeWeight">Trade weight</label>
          <input id="traitTradeWeight" inputmode="decimal" disabled />
        </div>
        <div>
          <label for="traitMaxMarkupTolerance">Max markup tolerance</label>
          <input id="traitMaxMarkupTolerance" inputmode="decimal" disabled />
        </div>
        <div>
          <label for="traitLowballTolerance">Lowball tolerance</label>
          <input id="traitLowballTolerance" inputmode="decimal" disabled />
        </div>
        <div>
          <label for="traitHaggleAggression">Haggle aggression</label>
          <input id="traitHaggleAggression" inputmode="decimal" disabled />
        </div>
        <div>
          <label for="traitTradeFairness">Trade fairness</label>
          <input id="traitTradeFairness" inputmode="decimal" disabled />
        </div>
        <div>
          <label for="traitRiskTolerance">Risk tolerance</label>
          <input id="traitRiskTolerance" inputmode="decimal" disabled />
        </div>
        <div class="trait-checks" aria-label="Commerce flags">
          <label><input type="checkbox" id="traitPrefersCash" disabled /> Prefers cash</label>
          <label><input type="checkbox" id="traitAcceptsTrades" disabled /> Accepts trades</label>
          <label><input type="checkbox" id="traitAcceptsJunkBundles" disabled /> Junk bundles</label>
        </div>
        <div class="wide">
          <label for="traitBuyTags">Buy interest tags</label>
          <input id="traitBuyTags" disabled />
        </div>
        <div class="wide">
          <label for="traitSellTags">Sell offer tags</label>
          <input id="traitSellTags" disabled />
        </div>
        <div class="wide">
          <label for="traitTradeTags">Trade interest tags</label>
          <input id="traitTradeTags" disabled />
        </div>
        <div class="wide">
          <label for="traitAvoidTags">Avoid tags</label>
          <input id="traitAvoidTags" disabled />
        </div>
        <div class="wide">
          <label for="traitNotes">Trait notes</label>
          <textarea id="traitNotes" disabled></textarea>
        </div>
      </div>
    </section>

    <section class="lists" aria-label="Item pool lists">
      <section class="list-panel" id="panelBuy" hidden>
        <h3>Buy Items</h3>
        <input type="search" id="filterBuy" placeholder="Filter buy items" disabled />
        <div class="bulk-actions" aria-label="Buy bulk item actions">
          <button type="button" id="selectAllBuy" disabled>Select all</button>
          <span>|</span>
          <button type="button" id="deselectAllBuy" disabled>Deselect all</button>
        </div>
        <div class="item-list" id="listBuy"></div>
      </section>
      <section class="list-panel" id="panelSell" hidden>
        <h3>Sell Items</h3>
        <input type="search" id="filterSell" placeholder="Filter sell items" disabled />
        <div class="bulk-actions" aria-label="Sell bulk item actions">
          <button type="button" id="selectAllSell" disabled>Select all</button>
          <span>|</span>
          <button type="button" id="deselectAllSell" disabled>Deselect all</button>
        </div>
        <div class="item-list" id="listSell"></div>
      </section>
      <section class="list-panel" id="panelTrade" hidden>
        <h3>Trade Items</h3>
        <input type="search" id="filterTrade" placeholder="Filter trade items" disabled />
        <div class="bulk-actions" aria-label="Trade bulk item actions">
          <button type="button" id="selectAllTrade" disabled>Select all</button>
          <span>|</span>
          <button type="button" id="deselectAllTrade" disabled>Deselect all</button>
        </div>
        <div class="item-list" id="listTrade"></div>
      </section>
    </section>
  </main>

  <script src="npc-editor.js?v=0.1.57"></script>
</body>
</html>
